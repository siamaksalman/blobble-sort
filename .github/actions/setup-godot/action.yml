name: Set up Godot
description: Installs the Godot editor and official export templates, and imports the project.
inputs:
  version:
    description: Godot version, matching the local editor.
    default: 4.7.2
  templates:
    description: Also install export templates.
    default: "false"
outputs:
  godot:
    description: Path to the Godot executable.
    value: ${{ steps.paths.outputs.godot }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: echo "godot=$HOME/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-templates-${{ inputs.templates }}

    - name: Download Godot
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable"
        mkdir -p ~/godot && cd ~/godot
        if [ ! -x "${{ steps.paths.outputs.godot }}" ]; then
          curl -fsSL -o editor.zip "$base/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
          unzip -q editor.zip && rm editor.zip
        fi
        if [ "${{ inputs.templates }}" = "true" ] && [ ! -d templates ]; then
          curl -fsSL -o templates.tpz "$base/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
        fi

    - name: Install export templates
      if: inputs.templates == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Presets reference res://.export-templates (gitignored locally); the official
        # pack uses the same file names. Android uses the editor's template folder.
        mkdir -p .export-templates ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        cp ~/godot/templates/* .export-templates/
        cp ~/godot/templates/* ~/.local/share/godot/export_templates/${{ inputs.version }}.stable/

    - name: Import project
      shell: bash
      run: make import GODOT="${{ steps.paths.outputs.godot }}"
