<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f6e9d8">
  <meta name="description" content="Bring the little jellies together. A soft and squishy color-sorting puzzle, at your own pace.">
  <title>Blobble · a little pocket of calm</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f6e9d8; color:#665343; font-family:ui-rounded,system-ui,sans-serif; }
    #canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; text-align:center; gap:14px; background:#f6e9d8; }
    .jelly { width:74px; height:90px; margin:0 auto 10px; border-radius:46% 48% 43% 44%; background:radial-gradient(at 30% 20%,#cba8ff,#ae7bf0 60%,#9864d7); box-shadow:3px 9px 14px #79593525; animation:breathe 2s ease-in-out infinite; }
    .jelly:after { content:'••'; letter-spacing:9px; padding-left:9px; font-size:26px; color:#30243c; line-height:65px; }
    h1 { margin:0; font-size:34px; font-weight:750; letter-spacing:-1px; }
    p { margin:0; font-size:14px; color:#947b63; }
    progress { width:180px; height:5px; margin:14px auto; accent-color:#9ba785; }
    #error { max-width:320px; line-height:1.6; }
    @keyframes breathe { 50% { transform:scale(1.04,.96) translateY(2px); } }
    @media(prefers-reduced-motion:reduce) { .jelly { animation:none; } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div style="position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)">
    <canvas id="canvas" aria-label="Blobble color sorting puzzle. Use arrow keys and Enter to select pockets. H gives a hint, Z undoes a move.">Your browser needs canvas support to play Blobble.</canvas>
  </div>
  <div id="loading" role="status">
    <div class="jelly" aria-hidden="true"></div>
    <h1>blobble</h1><p>a little pocket of calm</p>
    <progress id="progress" max="100" value="0"></progress><p id="error">Waking up the little jellies…</p>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    engine.startGame({
      canvas:document.getElementById('canvas'),
      onProgress:(current,total)=> { const progress=document.getElementById('progress'); if(total && progress) progress.value=current/total*100; }
    }).then(()=>document.getElementById('loading').remove()).catch(error=>{
      document.getElementById('progress').hidden=true;
      document.getElementById('error').textContent='Unable to start. Please try a current browser with WebGL 2 enabled. '+error.message;
      console.error(error);
    });
  </script>
</body>
</html>
